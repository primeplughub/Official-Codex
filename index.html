<!doctype html>
<html lang="en">
<head>
<meta name="google-site-verification" content="QOWaaH_VB2FnbpZNhrpBsLiS7JnmnSx3QJYrFiGB37k" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080611">
<title>Official Codex | Stay Connected</title>
<style>
:root{--purple:#851cff;--purple2:#b34cff;--white:#f7f4ff;--muted:#aaa5b8}
*{box-sizing:border-box}
a,a:visited,a:hover,a:active{color:inherit;text-decoration:none}
html{min-height:100%;background:#080611}
body{margin:0;min-height:100vh;color:var(--white);font-family:Arial,Helvetica,sans-serif;background:
radial-gradient(ellipse at 50% 24%,rgba(101,0,180,.24),transparent 34%),
radial-gradient(ellipse at 4% 78%,rgba(112,0,205,.2),transparent 25%),
radial-gradient(ellipse at 96% 90%,rgba(102,0,180,.16),transparent 22%),
linear-gradient(145deg,#090611 0%,#0b0814 48%,#080611 100%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:0;pointer-events:none;width:190px;height:100vh;top:0;opacity:.8}
body:before{left:-110px;background:linear-gradient(135deg,transparent 24%,#28005a 24% 30%,transparent 30% 38%,#4e00a8 38% 44%,transparent 44%);transform:skewY(-8deg)}
body:after{right:-120px;background:linear-gradient(135deg,transparent 35%,#241044 35% 44%,transparent 44% 55%,#4d00a0 55% 62%,transparent 62%);transform:skewY(-8deg)}
.page{position:relative;z-index:1;width:min(100%,760px);min-height:100vh;margin:auto;padding:32px 30px 44px;display:flex;flex-direction:column;align-items:center}
.crown{position:absolute;right:7%;top:28px;color:#941cff;font-size:52px;line-height:1;text-shadow:0 0 22px #8b1cff}
.profile-wrap{width:254px;height:254px;margin:135px auto 40px;border-radius:50%;padding:7px;background:linear-gradient(145deg,#7c00ff,#d58aff 48%,#5a00c8);box-shadow:0 0 16px #8b19ff,0 0 48px #7800e766}
.profile{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#080611;border:5px solid #100a1b}
.profile img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:clamp(38px,7vw,58px);font-weight:800;letter-spacing:-1.8px;text-align:center;margin:0;line-height:1.12}
h1 .codex{color:#a12cff}
.verified{display:inline-grid;place-items:center;vertical-align:middle;margin-left:9px;width:36px;height:36px;background:#8e19ff;color:#fff;clip-path:polygon(50% 0%,62% 9%,78% 5%,86% 20%,100% 30%,94% 47%,100% 63%,85% 75%,82% 92%,63% 91%,50% 100%,37% 91%,18% 94%,14% 77%,0 65%,7% 48%,1% 31%,16% 21%,22% 5%,39% 9%);font-size:21px}
.bio{margin:18px 0 42px;text-align:center;color:#b8b2c4;font-size:clamp(17px,3.2vw,23px);letter-spacing:.1px}
.divider{display:flex;align-items:center;justify-content:center;gap:30px;width:65%;margin:0 auto 40px;color:#a32cff;font-size:35px;line-height:1}
.divider:before,.divider:after{content:"";height:2px;flex:1;background:linear-gradient(90deg,transparent,#8d19e8)}
.divider:after{background:linear-gradient(90deg,#8d19e8,transparent)}
.links{width:100%;display:flex;flex-direction:column;gap:28px}
.link{width:100%;min-height:118px;display:grid;grid-template-columns:118px 2px minmax(0,1fr) 48px;align-items:center;gap:22px;padding:16px 20px 16px 30px;border:2px solid #7832ad;border-radius:36px;background:linear-gradient(105deg,rgba(54,15,83,.52),rgba(13,10,23,.96) 45%,rgba(18,11,30,.98));box-shadow:inset 0 0 20px rgba(142,34,255,.13),0 8px 25px #0006;transition:transform .2s,border-color .2s,box-shadow .2s}
.link:hover{transform:translateY(-2px);border-color:#bd72ff;box-shadow:inset 0 0 24px #8d20ff22,0 0 24px #8d20ff33}
.app-icon{width:90px;height:90px;border-radius:23px;display:grid;place-items:center;overflow:hidden}
.app-icon svg{width:58px;height:58px;display:block}
.discord .app-icon{background:#5865f2}
.tiktok .app-icon{background:#050505}
.instagram .app-icon{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.youtube .app-icon{background:#ff0808}
.whatsapp .app-icon{background:#16c85a;border-radius:50%}
.vline{width:2px;height:78px;background:#a7a0b3}
.link-copy{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:7px;overflow-wrap:anywhere}
.link-title{display:block;font-size:clamp(18px,3.1vw,27px);font-weight:750;line-height:1.22;white-space:normal}
.link-sub{display:block;font-size:clamp(14px,2.3vw,18px);color:#aaa5b8;line-height:1.4;margin:0;white-space:normal}
.arrow{width:42px;height:42px;display:grid;place-items:center;color:#f7f4ff;justify-self:center;background:none;border:0;border-radius:0}
.arrow svg{width:34px;height:34px;display:block;overflow:visible;filter:drop-shadow(0 0 5px #a12cff88)}
.whatsapp{border-color:#8d1bff;box-shadow:inset 0 0 25px #921cff22,0 0 23px #8418ff66,0 8px 25px #0006}
.whatsapp .vline{background:#a936ff}
.footer{display:flex;align-items:center;gap:22px;width:84%;margin:42px auto 0;color:#bdb5ca;letter-spacing:8px;font-size:16px;justify-content:center;white-space:nowrap}
.footer:before,.footer:after{content:"";height:2px;flex:1;background:linear-gradient(90deg,transparent,#8d19e8)}
.footer:after{background:linear-gradient(90deg,#8d19e8,transparent)}
.footer-crown{color:#a32cff;font-size:31px;letter-spacing:0;position:absolute;bottom:75px}
@media(max-width:760px){
.page{padding:24px 18px 34px}
.crown{top:20px;right:7%;font-size:40px}
.profile-wrap{width:190px;height:190px;margin:105px auto 30px}
h1{font-size:clamp(32px,8vw,43px);letter-spacing:-1.2px}
.verified{width:27px;height:27px;font-size:16px;margin-left:4px}
.bio{font-size:16px;margin:14px 0 32px}
.divider{margin-bottom:30px;gap:20px}
.links{gap:17px}
.link{min-height:88px;grid-template-columns:62px 2px minmax(0,1fr) 34px;gap:12px;padding:10px 12px 10px 13px;border-radius:25px}
.app-icon{width:62px;height:62px;border-radius:17px}
.app-icon svg{width:43px;height:43px}
.whatsapp .app-icon{border-radius:50%}
.vline{height:56px}
.link-title{font-size:clamp(15px,4vw,19px);white-space:normal}
.link-sub{font-size:clamp(12px,3.1vw,15px);margin-top:5px;white-space:normal}
.arrow{width:32px;height:32px}.arrow svg{width:29px;height:29px}
.footer{width:96%;font-size:11px;letter-spacing:5px;gap:13px;margin-top:32px}
.footer-crown{bottom:60px}
}
@media(max-width:360px){.link{grid-template-columns:50px 2px minmax(0,1fr) 28px;gap:8px;padding:9px}.app-icon{width:48px;height:48px}.app-icon svg{width:34px;height:34px}.arrow{width:27px;height:27px}.arrow svg{width:25px;height:25px}.link-title{font-size:14px}.link-sub{font-size:11px}}
</style>
</head>
